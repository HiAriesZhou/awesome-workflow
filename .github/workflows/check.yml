name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Generated files match workflows/*.yml
        run: |
          git diff --exit-code -- README.md src/data/workflows.json || {
            echo "::error::README.md or src/data/workflows.json is stale. Run 'npm run build:data' and commit the result."
            exit 1
          }
