<title id="wf-github-agentic-workflows-title">GitHub Agentic Workflows (Markdown → Actions) workflow diagram</title>
<desc id="wf-github-agentic-workflows-desc">4 steps. 1. Author workflow Markdown (human, human gate). 2. Compile with gh aw (tool). 3. Commit source + lockfile (human, human gate). 4. Event or schedule run (ci). Tools: github-actions, other.</desc>
