<title id="wf-oneredoak-code-review-title">Dual-Loop AI Code Review workflow diagram</title>
<desc id="wf-oneredoak-code-review-desc">4 steps. 1. Open or update PR (human, human gate). 2. Agent blocking-and-tackling (agent). 3. Human triage of findings (human, human gate). 4. Merge when clear (human, human gate). Tools: claude-code, github-actions.</desc>
