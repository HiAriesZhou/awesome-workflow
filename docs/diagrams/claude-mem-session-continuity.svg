<title id="wf-claude-mem-session-continuity-title">Persistent Agent Memory Across Sessions workflow diagram</title>
<desc id="wf-claude-mem-session-continuity-desc">4 steps. 1. Auto-capture session activity (tool). 2. Compress with AI (agent). 3. Reinject on next session (tool). 4. Periodic human audit (human, human gate). Tools: claude-code, mcp, skills, other.</desc>
